spring.application.name=spring-ecommerce

# ----------------------------------------------------------------------
# Database — MySQL in Docker, never a local install.
#
# When you start the app with Maven (`./mvnw spring-boot:run`) the
# spring-boot-docker-compose module reads compose.yaml, starts the
# `mysql` container and injects the real connection details, so the
# spring.datasource.* values below are just a fallback for when you run
# the container yourself (`docker compose up -d`) or from a packaged jar.
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/spring_ecommerce?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the container running after the app stops so the next start is fast.
spring.docker.compose.lifecycle-management=start-only

# ----------------------------------------------------------------------
# JPA / Hibernate
#
# ddl-auto=create drops and recreates the schema on every startup, then
# Hibernate runs src/main/resources/import.sql to reload the seed data.
# Switch to 'validate' (with Flyway/Liquibase) once the model settles.
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------
# Web
# ----------------------------------------------------------------------
server.port=8080
